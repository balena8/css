server:
  listen_address: "0.0.0.0"
  port: 8080

  # read_timeout protects the server from slow clients sending request bodies.
  read_timeout: 30s

  # write_timeout must be large enough because HTTP handlers wait for queued
  # receipt processing jobs to finish before returning the response.
  write_timeout: 30s

  idle_timeout: 60s

  tls:
    enabled: false
    cert_file: ""
    key_file: ""

  cors:
    enabled: true

    # "*" is okay only if you do not use browser credentials/cookies.
    # If you later use credentials, replace "*" with explicit frontend origins.
    allowed_origins:
      - "*"

    allowed_methods:
      - GET
      - POST
      - OPTIONS

    allowed_headers:
      - Authorization
      - Content-Type

api_keys:
  anthropic: ""
  openai: ""

  # The file is mounted from ./secrets/gemini.key into /app/secrets/gemini.key.
  gemini: "/app/secrets/gemini.key"

receipt_service:
  processing:
    queue:
      # Single receipt requests have their own queue so small user-facing jobs
      # do not wait behind large batch submissions.
      single_buffer: 100

      # Batch jobs are isolated because they usually care more about throughput
      # than low latency.
      batch_buffer: 100

    workers:
      single_workers: 4
      batch_workers: 2

  enrichment:
    enabled: true
    provider: "gemini"
    model: "gemini-2.5-flash"
    base_url: ""

    # Used as max tokens for the enrichment response.
    token_budget: 4096

    headers: {}

    # Empty means the enrichment package uses its default system prompt.
    system_prompt: ""